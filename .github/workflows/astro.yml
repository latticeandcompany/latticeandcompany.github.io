name: Deploy Astro site to Pages

on:
  push:
    branches: ["mega"]
  workflow_dispatch:

# GITHUB_TOKEN needs to read the repo, write a Pages deployment, and mint the
# OIDC token deploy-pages authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs collapse, but an in-progress one is
# never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.12.0.
          node-version: "22"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      # `site` and `base` come from astro.config.mjs, not from the Pages
      # outputs, because src/styles/_paths.scss hardcodes the same base.
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
